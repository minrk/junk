on:
  push:
    branches:
      - actions

jobs:
  test:
    name: Install and test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Test (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: pixi run test
